<body>

  <!-- Noscript fallback for search engines and users without JS -->
  <noscript>
    <div style="text-align:center;padding:40px;color:#e8e6f0;background:#0a0a1a;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;">
      <h1>🐍 Snake — Neon Arcade</h1>
      <p style="margin-top:16px;max-width:480px;line-height:1.6;">
        A free online Snake game with stunning neon visuals, 3 difficulty levels (Easy, Normal, Hard), smooth animations, and mobile-friendly touch controls. Navigate the snake to eat food, grow longer, and beat your high score.
      </p>
      <p style="margin-top:12px;color:#8888aa;">Please enable JavaScript to play.</p>
    </div>
  </noscript>

  <!-- Top Navigation -->
  <nav class="top-nav">
    <button class="nav-btn" onclick="window.location.href='dashboard.html'">🏆 Leaderboard</button>
    <button class="nav-btn login-btn" id="authBtn" onclick="window.location.href='login.html'">Login / Sign Up</button>
  </nav>

  <!-- Logo/Header Top Left -->
  <header class="header">
    <h1>🐍 Snake</h1>
    <p>Eat, grow, survive</p>
  </header>

  <main id="game-wrapper" role="main">



    <!-- Difficulty selector -->
    <nav class="difficulty-bar" aria-label="Game difficulty">
      <button class="diff-btn" data-diff="easy" aria-pressed="false">Easy</button>
      <button class="diff-btn active" data-diff="normal" aria-pressed="true">Normal</button>
      <button class="diff-btn" data-diff="hard" aria-pressed="false">Hard</button>
    </nav>

    <!-- Scores -->
    <section class="score-bar" aria-label="Score display">
      <div class="score-card" role="status" aria-live="polite">
        <div class="label">Score</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-card">
        <div class="label">Best</div>
        <div class="value high-score" id="highScore">0</div>
      </div>
    </section>

    <!-- Canvas + Overlays -->
    <section class="canvas-container" aria-label="Game board">
      <canvas id="gameCanvas" role="img" aria-label="Snake game board — use arrow keys or WASD to control the snake"></canvas>

      <!-- Start Overlay -->
      <div class="overlay" id="startOverlay" role="dialog" aria-label="Start game">
        <h2>Ready to Play?</h2>
        <button class="btn btn-primary" id="startBtn">Start Game</button>
      </div>

      <!-- Game Over Overlay -->
      <div class="overlay hidden" id="gameOverOverlay" role="dialog" aria-label="Game over">
        <h2 class="game-over-title">Game Over</h2>
        <p class="final-score">Score: <span id="finalScore">0</span></p>
        <button class="btn btn-primary" id="restartBtn">Play Again</button>
      </div>
    </section>

    <!-- Controls hint (desktop) -->
    <footer class="controls-info" aria-label="Keyboard controls">
      <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move</span>
      <span><kbd>Space</kbd> to start</span>
    </footer>

    <!-- Mobile D-Pad -->
    <nav class="dpad" id="dpad" aria-label="Mobile directional controls">
      <button class="dpad-btn" data-dir="up" aria-label="Move up">▲</button>
      <button class="dpad-btn" data-dir="left" aria-label="Move left">◀</button>
      <button class="dpad-btn" data-dir="right" aria-label="Move right">▶</button>
      <button class="dpad-btn" data-dir="down" aria-label="Move down">▼</button>
    </nav>

  </main>

  <script src="game.js"></script>
</body>
